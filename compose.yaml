name: butterfly

services:
  harmonicdb:
    build:
      context: .
      dockerfile: machine/porter/HarmonicDB.Dockerfile
    command: ["sh", "-c", "test -f /data/find-me.hws || python -m harmonic model-demo /data/find-me.hws --dataset find-me; test -f /data/find-me-private-symbol.hws || python -m harmonic model-demo /data/find-me-private-symbol.hws --dataset find-me-private; exec harmonic-host"]
    volumes:
      - harmonicdb-data:/data
      - porter-harmonicdb-ipc:/porter
    network_mode: none
    depends_on:
      porter-harmonicdb: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/porter/host.ready').exists()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  porter-find-me:
    build: ./systems/porter
    command:
      - "--identity"
      - "find-me"
      - "--ipc"
      - "/ipc"
      - "--routes"
      - '{"harmonicdb":"http://porter-harmonicdb:7070"}'
      - "--require-introductions"
      - "--relationships"
      - '{"harmonicdb":{"secret":"BUTTERFLY-PORTER-INTRODUCTION-1","authority":"technical-passport:offline-claim","kinds":["porter.return"],"max_package_bytes":262144,"max_outstanding_packages":1000,"max_outstanding_bytes":67108864,"expires_at":4102444800}}'
    volumes: [porter-find-me-ipc:/ipc]
    networks: [porter-fabric]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:7070/health',timeout=2).status == 200"]
      interval: 3s
      timeout: 2s
      retries: 10

  porter-harmonicdb:
    build: ./systems/porter
    command:
      - "--identity"
      - "harmonicdb"
      - "--ipc"
      - "/ipc"
      - "--routes"
      - '{"find-me":"http://porter-find-me:7070"}'
      - "--require-introductions"
      - "--relationships"
      - '{"find-me":{"secret":"BUTTERFLY-PORTER-INTRODUCTION-1","authority":"technical-passport:offline-claim","kinds":["hdbe.call"],"max_package_bytes":262144,"max_outstanding_packages":1000,"max_outstanding_bytes":67108864,"expires_at":4102444800}}'
    volumes: [porter-harmonicdb-ipc:/ipc]
    networks: [porter-fabric]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:7070/health',timeout=2).status == 200"]
      interval: 3s
      timeout: 2s
      retries: 10

  gpservers:
    build: ./systems/gpservers
    command: ["receiver", "--addr", "0.0.0.0:8090"]
    networks: [butterfly]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  lucida:
    build:
      context: .
      dockerfile: machine/lucida/Dockerfile
    ports:
      - "127.0.0.1:${LUCIDA_PORT:-8077}:8077"
    environment:
      LUCIDA_PREPARED_DIR: /lucida-state/prepared
    volumes: [lucida-prepared:/lucida-state]
    networks: [butterfly]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8077/health',timeout=3).status == 200"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s

  find-me-state:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /state/location && chmod -R 0777 /state"]
    volumes: [find-me-work:/state]
    network_mode: none
    restart: "no"

  find-me:
    build:
      context: .
      dockerfile: apps/find-me/Dockerfile
    environment: &publisher-environment
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      LOG_CHANNEL: stderr
      GPSERVERS_URL: http://gpservers:8090
      HARMONICDB_URL: http://harmonicdb:8787
      HARMONICDB_TIMEOUT: "150"
      PORTER_IPC: /porter
      FIND_ME_WORK_DIR: /app-state/location
      PASSPORT_VERIFIER_URL: http://passport-verifier:8790
      LUCIDA_URL: http://lucida:8077
      MAILWEB_MAILPIT_URL: http://mailpit:8025
      MAILWEB_SMTP_HOST: mailpit
      MAILWEB_SMTP_PORT: "1025"
      MAILWEB_PUBLISHER_MAILBOX: find-me@butterfly.local
    depends_on:
      find-me-state:
        condition: service_completed_successfully
      porter-find-me:
        condition: service_healthy
      lucida:
        condition: service_healthy
      gpservers:
        condition: service_healthy
      harmonicdb:
        condition: service_healthy
      passport-verifier:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks: [butterfly]
    volumes: [porter-find-me-ipc:/porter, find-me-work:/app-state]
    healthcheck:
      test: ["CMD", "php", "artisan", "find-me:health"]
      interval: 5s
      timeout: 3s
      retries: 12

  find-me-worker:
    build:
      context: .
      dockerfile: apps/find-me/Dockerfile
    command: ["php", "artisan", "mailweb:listen"]
    environment: *publisher-environment
    depends_on:
      find-me:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks: [butterfly]
    volumes: [porter-find-me-ipc:/porter, find-me-work:/app-state]

  mailweb:
    build:
      context: .
      dockerfile: machine/postbox/Dockerfile
    command: ["--transport", "smtp", "--timeout", "180s", "--ui", "--listen", "0.0.0.0:9847", "mailweb://find-me.local/"]
    environment:
      MAILWEB_SMTP_ADDRESS: mailpit:1025
      MAILWEB_MAILPIT_URL: http://mailpit:8025
      MAILWEB_PUBLISHER_MAILBOX: find-me@butterfly.local
      MAILWEB_PUBLISHER_MAP: find-me.local=find-me@butterfly.local,passport.local=passport-office@butterfly.local
      MAILWEB_CONTAINER_LISTEN: "true"
    ports:
      - "127.0.0.1:${MAILWEB_PORT:-9847}:9847"
    depends_on:
      lucida:
        condition: service_healthy
      find-me-worker:
        condition: service_started
      passport-office-worker:
        condition: service_started
      mailpit:
        condition: service_healthy
    networks: [butterfly]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9847/api/state"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  passport-verifier:
    build:
      context: ./systems/passports
      dockerfile: Dockerfile.verifier
    environment:
      PASSPORT_SERVICE: find-me.local
      PASSPORT_AUTHORITY_DOCUMENT: /trust/authority.json
      PASSPORT_TRUST_KEY: /trust/authority-public.pem
      PASSPORT_REVOCATIONS: /trust/revocations.json
    volumes:
      - passport-trust:/trust:ro
    depends_on:
      passport-authority: {condition: service_healthy}
    networks: [butterfly]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8790/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  passport-authority:
    build:
      context: ./systems/passports
      dockerfile: Dockerfile.authority
    volumes:
      - passport-authority-data:/authority
      - passport-trust:/trust
    networks: [butterfly]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8791/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  passport-service:
    build:
      context: ./systems/passports
      dockerfile: Dockerfile.holder
    environment:
      PASSPORT_HOLDER_STORAGE: /holder
      PASSPORT_UI_ORIGINS: http://localhost:${MAILWEB_PORT:-9847},http://127.0.0.1:${MAILWEB_PORT:-9847},http://0.0.0.0:${MAILWEB_PORT:-9847}
    volumes:
      - passport-holder-data:/holder
    ports:
      - "127.0.0.1:8792:8792"
    networks: [butterfly]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8792/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  passport-office:
    build:
      context: .
      dockerfile: apps/passport-office/Dockerfile
    environment: &passport-office-environment
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      LOG_CHANNEL: stderr
      MAILWEB_MAILPIT_URL: http://mailpit:8025
      MAILWEB_SMTP_HOST: mailpit
      MAILWEB_SMTP_PORT: "1025"
      MAILWEB_PUBLISHER_MAILBOX: passport-office@butterfly.local
      PASSPORT_AUTHORITY_URL: http://passport-authority:8791
    depends_on:
      passport-authority: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    networks: [butterfly]
    healthcheck:
      test: ["CMD", "php", "artisan", "passport-office:health"]
      interval: 5s
      timeout: 3s
      retries: 12

  passport-office-worker:
    build:
      context: .
      dockerfile: apps/passport-office/Dockerfile
    command: ["php", "artisan", "mailweb:listen"]
    environment: *passport-office-environment
    depends_on:
      passport-office: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    networks: [butterfly]

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [butterfly]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8025/readyz"]
      interval: 3s
      timeout: 2s
      retries: 15

  inspector:
    build:
      context: .
      dockerfile: machine/inspector/Dockerfile
    depends_on:
      harmonicdb: {condition: service_healthy}
      gpservers: {condition: service_healthy}
      lucida: {condition: service_healthy}
      passport-verifier: {condition: service_healthy}
      passport-service: {condition: service_healthy}
      passport-office: {condition: service_healthy}
      passport-authority: {condition: service_healthy}
      find-me: {condition: service_healthy}
      mailweb: {condition: service_healthy}
    networks: [butterfly, porter-fabric]
    volumes:
      - porter-find-me-ipc:/evidence/find-me:ro
      - porter-harmonicdb-ipc:/evidence/harmonicdb:ro
      - harmonicdb-data:/evidence/harmonicdb-data:ro
      - find-me-work:/evidence/work:ro
    restart: "no"

networks:
  butterfly:
    name: butterfly
  porter-fabric:
    name: butterfly-porter

volumes:
  harmonicdb-data:
  passport-holder-data:
  passport-authority-data:
  passport-trust:
  porter-find-me-ipc:
  porter-harmonicdb-ipc:
  find-me-work:
  lucida-prepared:
